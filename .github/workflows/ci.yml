name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  node:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    # Integration tests assert on transactional behaviour (conditional updates,
    # row locks, CHECK constraints), so they need a real PostgreSQL. Without one
    # they skip, and the F2 acceptance criteria would never actually run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bolsa
          POSTGRES_PASSWORD: bolsa
          POSTGRES_DB: bolsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolsa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bolsa:bolsa@localhost:5432/bolsa_test?schema=public
      DATABASE_URL_TEST: postgresql://bolsa:bolsa@localhost:5432/bolsa_test?schema=public
      SESSION_SECRET: ci-session-secret-that-is-long-enough-for-zod

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @bolsa/db exec prisma migrate deploy

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  python:
    name: Simulator parity (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install simulator
        working-directory: research/simulator
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # Fails if the research engine and the production engine disagree on any
      # shared test vector (spec 5.6).
      - name: Test
        working-directory: research/simulator
        run: pytest -q
