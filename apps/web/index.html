<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0b0f14" />
    <!-- iOS ignores the manifest and looks for this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Mercado de bebidas ao vivo" />
    <title>Bolsa de Bebidas</title>
    <!--
      The chosen theme has to be on <html> before the first paint, or a phone
      set to light flashes the dark background on every load. React applies it
      again once it mounts; this only removes the flash.
    -->
    <script>
      (function () {
        try {
          var pinned = { '/screen': 'dark', '/prices': 'light' };
          var saved = JSON.parse(localStorage.getItem('bolsa-settings') || '{}');
          var state = saved.state || {};
          document.documentElement.dataset.theme =
            pinned[location.pathname] || state.theme || 'dark';
          if (state.locale) {
            document.documentElement.lang = state.locale;
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
